name: ci

on:
  push:
  pull_request:

jobs:
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The same targets a laptop builds: unit tests, then the typechecked, budget-checked bundle.
      - name: Unit tests
        run: docker build --target test -t videns-test . && docker run --rm videns-test
      - name: Build runtime image (typecheck, bundle, budget)
        run: docker build --target runtime -t videns .
      - name: Browser tests
        run: docker compose --profile e2e up --build --abort-on-container-exit --exit-code-from e2e e2e
      - name: Smoke test the default stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/videns.config.json
          timeout 5 curl -sN http://127.0.0.1:8080/picture/v0/stream | grep -m1 '"type":"hello"'
          timeout 5 curl -sN http://127.0.0.1:8080/truth/v0/stream | grep -m1 '"schema":"truth.v0"'
      - name: Tear down
        if: always()
        run: docker compose --profile e2e down --remove-orphans
