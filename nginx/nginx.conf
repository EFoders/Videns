# Lightweight by design: two workers are plenty for one viewer and its feed.
worker_processes 2;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
        application/yaml yaml yml;
    }
    default_type application/octet-stream;

    log_format main '$remote_addr "$request" $status $body_bytes_sent $request_time';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Rendered by the entrypoint from templates/ into /tmp, a tmpfs, so the root
    # filesystem stays read-only.
    include /tmp/*.conf;
}
